<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130" fill="#1B2A4A">
  <!-- Lion Capital of Ashoka (Official Emblem of India Stylized Vector) -->
  <g id="lions">
    <!-- Center Lion -->
    <path d="M42 12 C42 6, 58 6, 58 12 C60 12, 62 14, 62 18 C62 22, 59 25, 59 28 C61 31, 60 36, 58 40 C57 44, 53 47, 50 48 C47 47, 43 44, 42 40 C40 36, 39 31, 41 28 C41 25, 38 22, 38 18 C38 14, 40 12, 42 12 Z" />
    <!-- Left Lion Profile -->
    <path d="M38 18 C34 16, 28 20, 27 26 C26 31, 29 35, 31 38 C33 42, 37 45, 41 47 C40 43, 38 38, 38 34 C38 29, 39 24, 38 18 Z" opacity="0.9" />
    <!-- Right Lion Profile -->
    <path d="M62 18 C66 16, 72 20, 73 26 C74 31, 71 35, 69 38 C67 42, 63 45, 59 47 C60 43, 62 38, 62 34 C62 29, 61 24, 62 18 Z" opacity="0.9" />
    <!-- Lion Mane Details -->
    <path d="M46 22 Q50 26 54 22 Q50 32 46 22" fill="#FFFFFF" opacity="0.4" />
    <path d="M47 30 Q50 35 53 30 Q50 40 47 30" fill="#FFFFFF" opacity="0.4" />
  </g>
  <!-- Abacus Base Platform -->
  <rect x="22" y="52" width="56" height="10" rx="3" fill="#1B2A4A" />
  <!-- Ashoka Chakra (Wheel of Dharma) in Center of Abacus -->
  <circle cx="50" cy="57" r="4.2" fill="#FFFFFF" />
  <circle cx="50" cy="57" r="3.2" fill="#1B2A4A" />
  <circle cx="50" cy="57" r="1" fill="#FFFFFF" />
  <!-- Galloping Horse (Left) & Bull (Right) Stylized Shapes -->
  <ellipse cx="32" cy="57" rx="3.5" ry="1.8" fill="#FFFFFF" opacity="0.8" />
  <ellipse cx="68" cy="57" rx="3.5" ry="1.8" fill="#FFFFFF" opacity="0.8" />
  <!-- Lotus Bell Base -->
  <path d="M26 64 C26 64, 36 62, 50 62 C64 62, 74 64, 74 64 C72 73, 65 79, 50 79 C35 79, 28 73, 26 64 Z" fill="#1B2A4A" />
  <path d="M30 66 C35 74, 65 74, 70 66" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.4" />
  <!-- Pedestal Base Plinth -->
  <rect x="20" y="81" width="60" height="5" rx="1.5" fill="#1B2A4A" />
  <!-- Inscription: Satyameva Jayate (सत्यमेव जयते) -->
  <text x="50" y="98" font-family="'Noto Sans Devanagari', 'Segoe UI', serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1B2A4A" letter-spacing="1">सत्यमेव जयते</text>
</svg>
